<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shapes Grid</title>
<style>
.grid {
  display: grid;
  grid-template-columns: repeat(4, 100px);  /* 4 columns */
  grid-template-rows: repeat(5, 100px);     /* 5 rows */
  gap: 20px;
}

.shape {
  width: 80px;
  height: 80px;
  position: relative;
}

.shape-inner {
  width: 100%;
  height: 100%;
  cursor: pointer;
}

/* Shapes */
.star {
  background: gold;
  clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}

.triangle {
  background: teal;
  clip-path: polygon(50% 0%,0% 100%,100% 100%);
}

.circle {
  background: tomato;
  border-radius: 50%;
}

.square {
  background: purple;
}

/* Tooltip */
.tooltip {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(5px);
  margin-top: 8px;

  background: black;
  color: white;
  padding: 8px 12px;
  font-size: 12px;
  border-radius: 6px;

  box-shadow: 0 6px 14px rgba(0,0,0,0.25);

  opacity: 0;
  visibility: hidden;
  transition: all 0.25s ease;

  white-space: nowrap;
  z-index: 9999;
}

.tooltip::after {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 6px;
  border-style: solid;
  border-color: transparent transparent black transparent;
}

/* IMPORTANT FIX */
.shape:hover .tooltip {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
</head>

<body>

<div class="grid" id="grid"></div>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQiopZ2Mjiyll1D7POdyD4FXQgnAHq2YcZZR620h8oyqU1YATulXiGcTJqjoys5nDDj07jV5Fr54UF6/pub?output=csv";

const grid = document.getElementById("grid");

function parseCSV(text){
  const rows = text.trim().split("\n");
  const headers = rows[0].split(",");
  return rows.slice(1).map(row=>{
    const values = row.split(",");
    let obj = {};
    headers.forEach((h,i)=> obj[h.trim()] = values[i]?.trim());
    return obj;
  });
}

function createShape(data){

  const container = document.createElement("div");
  container.classList.add("shape");

  container.style.gridRow = data.HP;
  container.style.gridColumn = data.VP;

  const inner = document.createElement("div");
  const shapeType =
    data.Name.replace(/[0-9]/g,'').toLowerCase();

  inner.classList.add("shape-inner", shapeType);

  const tooltip = document.createElement("div");
  tooltip.classList.add("tooltip");

  tooltip.innerHTML =
    `Name: ${data.Name}<br>
     HP: ${data.HP}<br>
     VP: ${data.VP}`;

  container.appendChild(inner);
  container.appendChild(tooltip);

  if(data.Visible.toLowerCase() !== "true"){
    container.style.display = "none";
  }

  grid.appendChild(container);
}

async function loadSheet(){
  const res = await fetch(sheetURL);
  const text = await res.text();
  const data = parseCSV(text);

  //grid.innerHTML = "";
  data.forEach(createShape);
}

loadSheet();
setInterval(loadSheet,5000);

</script>

</body>

</html>
